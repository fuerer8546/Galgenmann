name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Abhängigkeiten installieren
        run: npm ci || npm install

      - name: Web-Dateien ins Android-Projekt kopieren
        run: npx cap sync android

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Galgenmaennchen.apk

      - name: Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Galgenmännchen Build ${{ github.run_number }}
          files: Galgenmaennchen.apk
